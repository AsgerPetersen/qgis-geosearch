# --------------------------------------------------------------------------
# Præfiks-syntaks
# --------------------------------------------------------------------------
- id: pfx-kom-aar
  story: "Brugeren bruger præfikset 'kom:' for kun at søge i kommuner"
  input: "kom: aar"
  expect:
    text: "Aarhus Kommune"
    within: 3
    geometry: polygon
  known_gap: 3
  notes: "Kun kommuner må vises."

- id: pfx-adr-versaler-uden-mellemrum
  story: "Brugeren skriver præfikset med store bogstaver og uden mellemrum"
  input: "ADR:vangebovej 71"
  types: [ste]
  expect:
    text: "Vangebovej 71, Søllerød, 2840 Holte"
    within: 1
    geometry: point
  notes: "Præfikset overstyrer de valgte typer (her kun stednavne)."

- id: pfx-ukendt-praefiks
  story: "Brugeren skriver et præfiks som pluginet ikke kender ('udg:' for udgåede matrikler)"
  input: "udg: 1an gentofte"
  expect:
    text: "Husnumre - Der skete en fejl"
    within: 1
  notes: "Ukendt præfiks: hele teksten inkl. 'udg:' sendes til alle typer. GSearch svarer HTTP 400 (Invalid input) på alle 8, så pop-op'en viser 8 fejlrækker."

- id: pfx-kun-praefiks
  story: "Brugeren har kun skrevet præfikset 'adr:'"
  input: "adr:"
  expect:
    empty: true
  notes: "Tom søgetekst efter præfiks: pluginet sender ingen forespørgsel."

