    within: 3
    geometry: point
  known_gap: 3
  notes: "Uden husnummer: GSearch giver husnumre på vejen. Alle hits skal ligge i Aarhus."

- id: kf-vestergade-1-101
  story: "Brugeren har kommunefilter på København og vil finde Vestergade 1"
  input: "vestergade 1"
