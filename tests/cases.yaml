# Case catalogue for Geosearch DK.
#
# Each case is a user story: the user wants to find something, types `input`
# with the given plugin settings, expects to see `expect.text` within the top
# `expect.within` rows of the popup, and when it is clicked the map shows a
# geometry of kind `expect.geometry`.
#
# Fields:
#   id          unique kebab-case id, used as the fixture file name
#   story       Danish user story
#   input       exactly what is typed, including any prefix such as "mat:"
#   types       plugin resource keys (adr ste pos mat kom ops pol reg);
#               omitted = all 8 (the plugin default). A prefix in `input`
#               overrides this, exactly as in the plugin.
#   kommuner    optional kommunefilter codes, e.g. ["615"]
#   expect      what the user sees TODAY in GSearch (see tests/fixtures/gsearch/BASELINE.md)
#     text      visningstekst of the intended hit
#     within    the hit appears within the top N rows of the popup
#     geometry  point | line | polygon
#     empty     true = no rows at all (the popup does not open); used instead of text
#   known_gap   optional: issue number in this repo if Bifrost is expected to fail the case
#   notes       free text
#
# Record or refresh the GSearch baseline with:
#   uv run tests/tools/record_gsearch.py record

# --------------------------------------------------------------------------
# Adresser (husnumre)
# --------------------------------------------------------------------------
- id: adr-vangebovej-71
  story: "Brugeren vil finde Vangebovej 71 og zoome til adressen"
  input: "Vangebovej 71"
  types: [adr]
  expect:
    text: "Vangebovej 71, Søllerød, 2840 Holte"
    within: 1
    geometry: point
  notes: "Fra sammenligningssiden. Adressen har et supplerende bynavn (Søllerød)."

- id: adr-vangebovej-71-alle-typer
